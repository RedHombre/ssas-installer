[package]
name = "ssas-installer"
version = "2.0.0"
edition = "2021"
description = "Installazione guidata di SSAS AI (GUI): Docker, Kubernetes, Windows e proxy SSAS"

[dependencies]
eframe = "0.31"
rfd = "0.15"
rand = "0.8"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
